<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanban Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['"Space Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  :root {
    --bg: #F3F4F7;
    --surface: #FFFFFF;
    --surface-alt: #E9EBF0;
    --ink: #171A21;
    --ink-soft: #565D6B;
    --ink-faint: #8B93A1;
    --line: #DEE1E7;
    --accent: #2F5FBF;
    --accent-soft: #E4EBFB;
    --danger: #C24B3D;
    --col-todo: #8B93A1;
    --col-doing: #2F5FBF;
    --col-done: #3E8F6B;
    --pri-alta-bg: #FBE6E2; --pri-alta-fg: #B23A26; --pri-alta-line:#D6483A;
    --pri-media-bg: #FBEEDC; --pri-media-fg: #A6631B; --pri-media-line:#DB8A2E;
    --pri-baixa-bg: #EDEFF3; --pri-baixa-fg: #5B6472; --pri-baixa-line:#8B93A1;

    --pal-blue-bg:#DCE7FB; --pal-blue-fg:#24549E;
    --pal-purple-bg:#E7E1FB; --pal-purple-fg:#5A3FA6;
    --pal-teal-bg:#DEEFEA; --pal-teal-fg:#2F6F62;
    --pal-amber-bg:#FBF1D2; --pal-amber-fg:#8A6D12;
    --pal-green-bg:#DCF0E3; --pal-green-fg:#257A4C;
    --pal-copper-bg:#F5E4D7; --pal-copper-fg:#8A5A2E;
    --pal-rose-bg:#FBE0E3; --pal-rose-fg:#A6335A;
    --pal-slate-bg:#E9EBF0; --pal-slate-fg:#4B5563;

    --accent-profissional: #2F5FBF; --accent-profissional-soft:#E4EBFB;
    --accent-pessoal: #C97A3C; --accent-pessoal-soft:#FBEBDA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131A; --surface: #171B24; --surface-alt: #1F2430;
      --ink: #E7EAF0; --ink-soft: #A2A9B8; --ink-faint: #6B7280;
      --line: #2A2F3B; --accent: #6C9AF0; --accent-soft: #1E2A44;
      --danger: #E17E6C;
      --col-todo: #6B7280; --col-doing: #6C9AF0; --col-done: #7FC29B;
      --pri-alta-bg: #3A2320; --pri-alta-fg: #E9917F; --pri-alta-line:#E9917F;
      --pri-media-bg: #362B18; --pri-media-fg: #E5B978; --pri-media-line:#E5B978;
      --pri-baixa-bg: #262B34; --pri-baixa-fg: #A2A9B8; --pri-baixa-line:#7A8290;

      --pal-blue-bg:#182A46; --pal-blue-fg:#8FB4EE;
      --pal-purple-bg:#241C3D; --pal-purple-fg:#C3B2EE;
      --pal-teal-bg:#1B2E29; --pal-teal-fg:#7FC2AE;
      --pal-amber-bg:#362E14; --pal-amber-fg:#E3C567;
      --pal-green-bg:#163526; --pal-green-fg:#7FCB9E;
      --pal-copper-bg:#3A2A1A; --pal-copper-fg:#E0AD7C;
      --pal-rose-bg:#3A1F28; --pal-rose-fg:#E698B2;
      --pal-slate-bg:#262B34; --pal-slate-fg:#A8B0BE;

      --accent-profissional:#6C9AF0; --accent-profissional-soft:#1E2A44;
      --accent-pessoal:#E0975A; --accent-pessoal-soft:#3A2A1A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131A; --surface: #171B24; --surface-alt: #1F2430;
    --ink: #E7EAF0; --ink-soft: #A2A9B8; --ink-faint: #6B7280;
    --line: #2A2F3B; --accent: #6C9AF0; --accent-soft: #1E2A44;
    --danger: #E17E6C;
    --col-todo: #6B7280; --col-doing: #6C9AF0; --col-done: #7FC29B;
    --pri-alta-bg: #3A2320; --pri-alta-fg: #E9917F; --pri-alta-line:#E9917F;
    --pri-media-bg: #362B18; --pri-media-fg: #E5B978; --pri-media-line:#E5B978;
    --pri-baixa-bg: #262B34; --pri-baixa-fg: #A2A9B8; --pri-baixa-line:#7A8290;

    --pal-blue-bg:#182A46; --pal-blue-fg:#8FB4EE;
    --pal-purple-bg:#241C3D; --pal-purple-fg:#C3B2EE;
    --pal-teal-bg:#1B2E29; --pal-teal-fg:#7FC2AE;
    --pal-amber-bg:#362E14; --pal-amber-fg:#E3C567;
    --pal-green-bg:#163526; --pal-green-fg:#7FCB9E;
    --pal-copper-bg:#3A2A1A; --pal-copper-fg:#E0AD7C;
    --pal-rose-bg:#3A1F28; --pal-rose-fg:#E698B2;
    --pal-slate-bg:#262B34; --pal-slate-fg:#A8B0BE;

    --accent-profissional:#6C9AF0; --accent-profissional-soft:#1E2A44;
    --accent-pessoal:#E0975A; --accent-pessoal-soft:#3A2A1A;
  }
  :root[data-workspace="profissional"] { --accent: var(--accent-profissional); --accent-soft: var(--accent-profissional-soft); }
  :root[data-workspace="pessoal"] { --accent: var(--accent-pessoal); --accent-soft: var(--accent-pessoal-soft); }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .board-scroll::-webkit-scrollbar { height: 8px; }
  .board-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  .column { background: var(--surface-alt); border-radius: 10px; display:flex; flex-direction:column; }
  @media (min-width: 640px) {
    .board-scroll { scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
    .column { scroll-snap-align: start; max-height: calc(100vh - 190px); }
  }
  .column-header { border-top: 3px solid var(--col-color); border-radius: 10px 10px 0 0; }
  .column-body { overflow-y: auto; flex: 1 1 auto; }
  .column-body::-webkit-scrollbar { width: 6px; }
  .column-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  .column-body.drop-target { background: var(--accent-soft); outline: 2px dashed var(--accent); outline-offset: -4px; }

  .kanban-card {
    background: var(--surface);
    border-left: 4px solid var(--pri-color, var(--ink-faint));
    border-radius: 8px;
    padding: 10px 11px;
    touch-action: none;
    user-select: none;
    cursor: grab;
  }
  .kanban-card.is-dragging-source { opacity: 0.35; }
  .kanban-card:active { cursor: grabbing; }
  .card-title { font-size: 14.5px; font-weight: 500; line-height: 1.35; word-break: break-word; }
  .card-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-actions button { color: var(--ink-faint); padding: 3px; border-radius: 5px; }
  .card-actions button:hover { color: var(--ink); background: var(--surface-alt); }

  .tag, .priority-badge, .due {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .tag[data-color="blue"] { background:var(--pal-blue-bg); color:var(--pal-blue-fg); }
  .tag[data-color="purple"] { background:var(--pal-purple-bg); color:var(--pal-purple-fg); }
  .tag[data-color="teal"] { background:var(--pal-teal-bg); color:var(--pal-teal-fg); }
  .tag[data-color="amber"] { background:var(--pal-amber-bg); color:var(--pal-amber-fg); }
  .tag[data-color="green"] { background:var(--pal-green-bg); color:var(--pal-green-fg); }
  .tag[data-color="copper"] { background:var(--pal-copper-bg); color:var(--pal-copper-fg); }
  .tag[data-color="rose"] { background:var(--pal-rose-bg); color:var(--pal-rose-fg); }
  .tag[data-color="slate"] { background:var(--pal-slate-bg); color:var(--pal-slate-fg); }

  .priority-badge.pri-alta { background: var(--pri-alta-bg); color: var(--pri-alta-fg); }
  .priority-badge.pri-media { background: var(--pri-media-bg); color: var(--pri-media-fg); }
  .priority-badge.pri-baixa { background: var(--pri-baixa-bg); color: var(--pri-baixa-fg); }
  .due { background: var(--surface-alt); color: var(--ink-faint); }
  .due.overdue { background: var(--pri-alta-bg); color: var(--pri-alta-fg); }

  .drag-ghost {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    background: var(--surface);
    border-left: 4px solid var(--pri-color, var(--ink-faint));
    border-radius: 8px;
    padding: 10px 11px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    transform: rotate(-1.5deg) scale(1.03);
    opacity: 0.96;
  }

  .ws-tab {
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
  }
  .ws-tab.active { border-color: transparent; color: #fff; background: var(--accent); }

  .segmented { display:flex; gap:6px; flex-wrap:wrap; }
  .segmented button {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    background: var(--surface);
    color: var(--ink-soft);
  }
  .segmented button.selected { border-color: transparent; font-weight: 600; }
  .seg-pri-alta.selected { background: var(--pri-alta-bg); color: var(--pri-alta-fg); }
  .seg-pri-media.selected { background: var(--pri-media-bg); color: var(--pri-media-fg); }
  .seg-pri-baixa.selected { background: var(--pri-baixa-bg); color: var(--pri-baixa-fg); }

  .tag-option.selected[data-color="blue"] { background:var(--pal-blue-bg); color:var(--pal-blue-fg); }
  .tag-option.selected[data-color="purple"] { background:var(--pal-purple-bg); color:var(--pal-purple-fg); }
  .tag-option.selected[data-color="teal"] { background:var(--pal-teal-bg); color:var(--pal-teal-fg); }
  .tag-option.selected[data-color="amber"] { background:var(--pal-amber-bg); color:var(--pal-amber-fg); }
  .tag-option.selected[data-color="green"] { background:var(--pal-green-bg); color:var(--pal-green-fg); }
  .tag-option.selected[data-color="copper"] { background:var(--pal-copper-bg); color:var(--pal-copper-fg); }
  .tag-option.selected[data-color="rose"] { background:var(--pal-rose-bg); color:var(--pal-rose-fg); }
  .tag-option.selected[data-color="slate"] { background:var(--pal-slate-bg); color:var(--pal-slate-fg); }

  .modal-field label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; display:block; }
  .modal-field input[type="text"], .modal-field textarea, .modal-field input[type="date"] {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 10px; font-size: 14px;
  }

  .color-dot { width:20px; height:20px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer; }
  .color-dot[data-active="true"] { border-color: var(--ink); }
  .color-dots { display:flex; gap:5px; flex-wrap:wrap; }

  .tag-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .tag-row:last-child { border-bottom:none; }
  .tag-label-input { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13.5px; }
  .tag-delete { color:var(--ink-faint); padding:5px; border-radius:5px; flex-shrink:0; }
  .tag-delete:hover { color:var(--danger); background:var(--surface-alt); }
  .add-tag-row { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .add-tag-row input[type="text"] { flex:1; min-width:110px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font-size:13.5px; }

  .toast { background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13px; max-width:88vw; box-shadow:0 8px 20px rgba(0,0,0,0.28); cursor:pointer; }
  .toast.error { background:var(--danger); color:#fff; }
  .toast.info { background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .due[data-synced="true"]::after { content:"✓"; margin-left:2px; }
</style>
</head>
<body>

<header class="px-4 py-4 sm:px-6 border-b" style="border-color:var(--line)">
  <div class="flex items-start sm:items-center justify-between gap-3 flex-wrap">
    <div>
      <h1 class="font-display text-2xl sm:text-[28px] font-semibold" style="color:var(--ink)">Kanban Pessoal</h1>
      <p class="text-sm mt-0.5" style="color:var(--ink-soft)">Dois quadros isolados: profissional e pessoal &amp; estudos.</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="googleSignInBtn" class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium border" style="border-color:var(--line); background:var(--surface)">
        <svg width="15" height="15" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span id="googleSignInLabel">Entrar com o Google</span>
      </button>
      <button id="msSignInBtn" class="hidden items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium border" style="border-color:var(--line); background:var(--surface)">
        <svg width="15" height="15" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
        <span id="msSignInLabel">Entrar com a Microsoft</span>
      </button>
      <button id="manageTagsBtn" aria-label="Gerenciar tags" class="p-2 rounded-lg border" style="border-color:var(--line); background:var(--surface)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.42 0l8.29-8.29a1 1 0 0 0 0-1.42L12 2Z"/><circle cx="7" cy="7" r="1"/></svg>
      </button>
      <button id="themeToggle" aria-label="Alternar tema" class="p-2 rounded-lg border" style="border-color:var(--line); background:var(--surface)"></button>
      <button id="addTaskBtn" class="flex items-center gap-1.5 px-3 sm:px-3.5 py-2 rounded-lg text-sm font-medium text-white" style="background:var(--accent)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="hidden sm:inline">Nova tarefa</span>
      </button>
    </div>
  </div>
  <nav class="flex gap-2 mt-3.5" id="workspaceTabs">
    <button type="button" data-workspace="profissional" class="ws-tab">Profissional</button>
    <button type="button" data-workspace="pessoal" class="ws-tab">Pessoal &amp; Estudos</button>
  </nav>
</header>

<div id="configWarning" class="hidden mx-4 sm:mx-6 mt-4 p-3 rounded-lg text-sm" style="background:var(--pri-alta-bg); color:var(--pri-alta-fg);"></div>

<main class="board-scroll flex flex-col sm:flex-row gap-4 px-4 py-5 sm:px-6 sm:overflow-x-auto sm:items-start" id="board">
  <section class="column w-full sm:flex-1 sm:min-w-[280px]" data-status="todo" style="--col-color:var(--col-todo)">
    <div class="column-header flex items-center justify-between px-3.5 py-3">
      <h2 class="font-display font-semibold text-[15px]">A Fazer</h2>
      <span class="font-mono text-[11px] px-2 py-0.5 rounded-full" id="count-todo" style="background:var(--surface); color:var(--ink-faint)">0</span>
    </div>
    <div class="column-body px-2.5 pb-2.5 flex flex-col gap-2.5" id="body-todo" data-status="todo"></div>
    <button class="add-in-column text-left text-sm px-3.5 py-2.5" data-status="todo" style="color:var(--ink-faint)">+ Adicionar cartão</button>
  </section>

  <section class="column w-full sm:flex-1 sm:min-w-[280px]" data-status="doing" style="--col-color:var(--col-doing)">
    <div class="column-header flex items-center justify-between px-3.5 py-3">
      <h2 class="font-display font-semibold text-[15px]">Em Andamento</h2>
      <span class="font-mono text-[11px] px-2 py-0.5 rounded-full" id="count-doing" style="background:var(--surface); color:var(--ink-faint)">0</span>
    </div>
    <div class="column-body px-2.5 pb-2.5 flex flex-col gap-2.5" id="body-doing" data-status="doing"></div>
    <button class="add-in-column text-left text-sm px-3.5 py-2.5" data-status="doing" style="color:var(--ink-faint)">+ Adicionar cartão</button>
  </section>

  <section class="column w-full sm:flex-1 sm:min-w-[280px]" data-status="done" style="--col-color:var(--col-done)">
    <div class="column-header flex items-center justify-between px-3.5 py-3">
      <h2 class="font-display font-semibold text-[15px]">Concluído</h2>
      <span class="font-mono text-[11px] px-2 py-0.5 rounded-full" id="count-done" style="background:var(--surface); color:var(--ink-faint)">0</span>
    </div>
    <div class="column-body px-2.5 pb-2.5 flex flex-col gap-2.5" id="body-done" data-status="done"></div>
    <button class="add-in-column text-left text-sm px-3.5 py-2.5" data-status="done" style="color:var(--ink-faint)">+ Adicionar cartão</button>
  </section>
</main>

<p class="px-4 sm:px-6 text-xs" style="color:var(--ink-faint)"><span id="storageStatus">carregando…</span> — os dois quadros ficam guardados separadamente</p>
<div id="toastHost" class="fixed left-1/2 z-[60] flex flex-col gap-2 items-center" style="bottom:20px; transform:translateX(-50%);"></div>

<!-- Modal: nova tarefa / editar -->
<div id="modalOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(10,12,16,0.45)">
  <div class="w-full max-w-md rounded-xl p-5 sm:p-6 max-h-[92vh] overflow-y-auto" style="background:var(--surface)">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-display font-semibold text-lg" id="modalTitle">Nova tarefa</h3>
      <button id="modalClose" aria-label="Fechar" class="p-1 rounded" style="color:var(--ink-faint)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="taskForm" class="flex flex-col gap-3.5">
      <div class="modal-field">
        <label for="fTitle">Título</label>
        <input type="text" id="fTitle" required maxlength="120" placeholder="Ex: Entregar relatório de estágio" />
      </div>
      <div class="modal-field">
        <label for="fDesc">Descrição</label>
        <textarea id="fDesc" rows="3" maxlength="500" placeholder="Detalhes (opcional)"></textarea>
      </div>
      <div class="modal-field">
        <label for="fDate">Data de vencimento</label>
        <input type="date" id="fDate" />
      </div>
      <div class="modal-field">
        <div class="flex items-center justify-between mb-1">
          <label class="mb-0">Tag</label>
          <button type="button" id="openTagManagerFromForm" class="text-xs" style="color:var(--accent)">Gerenciar tags</button>
        </div>
        <div class="segmented" id="tagPicker"></div>
      </div>
      <div class="modal-field">
        <label>Prioridade</label>
        <div class="segmented" id="priorityPicker">
          <button type="button" class="seg-pri-alta" data-priority="alta">Alta</button>
          <button type="button" class="seg-pri-media" data-priority="media">Média</button>
          <button type="button" class="seg-pri-baixa" data-priority="baixa">Baixa</button>
        </div>
      </div>
      <div class="flex items-center justify-between mt-2">
        <button type="button" id="deleteTaskBtn" class="hidden text-sm" style="color:var(--danger)">Excluir</button>
        <div class="flex items-center gap-2 ml-auto">
          <button type="button" id="cancelBtn" class="px-4 py-2 rounded-lg text-sm" style="background:var(--surface-alt); color:var(--ink-soft)">Cancelar</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium text-white" style="background:var(--accent)">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Modal: gerenciar tags -->
<div id="tagManagerOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(10,12,16,0.45)">
  <div class="w-full max-w-md rounded-xl p-5 sm:p-6 max-h-[92vh] overflow-y-auto" style="background:var(--surface)">
    <div class="flex items-center justify-between mb-2">
      <h3 class="font-display font-semibold text-lg">Tags — <span id="tmWorkspaceLabel"></span></h3>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="text-xs mb-2" style="color:var(--ink-faint)">Clique numa bolinha de cor para recolorir, edite o nome direto no campo, ou exclua.</p>
    <div id="tagManagerList"></div>
    <div class="add-tag-row">
      <input type="text" id="newTagLabel" maxlength="40" placeholder="Nova tag" />
      <div class="color-dots" id="newTagColorPicker"></div>
      <button type="button" id="addTagBtn" class="px-3 py-1.5 rounded-lg text-sm font-medium text-white" style="background:var(--accent)">Adicionar</button>
    </div>
  </div>
</div>

<script>
(function () {
  // ======================================================================
  // CONFIGURAÇÃO — preencha antes de publicar no GitHub Pages
  //
  // GOOGLE (planilha + calendário do quadro Pessoal & Estudos)
  // 1) console.cloud.google.com → crie um projeto → ative "Google Calendar
  //    API" e "Google Sheets API".
  // 2) APIs & Services → OAuth consent screen → External → modo "Testing"
  //    → adicione seu próprio e-mail em "Test users".
  // 3) APIs & Services → Credentials → Create Credentials → OAuth client ID
  //    → tipo "Web application" → em "Authorized JavaScript origins" some
  //    a URL do seu GitHub Pages (ex: https://seu-usuario.github.io).
  // 4) Crie uma planilha nova no Google Sheets e copie o ID dela — é o
  //    trecho entre /d/ e /edit na URL.
  //
  // MICROSOFT (calendário do quadro Profissional, no Outlook)
  // 5) portal.azure.com → Microsoft Entra ID → App registrations → New
  //    registration. Em "Supported account types" escolha "Contas em
  //    qualquer diretório organizacional e contas pessoais da Microsoft".
  //    Em "Redirect URI" escolha plataforma "Single-page application (SPA)"
  //    e cole a MESMA URL do seu GitHub Pages.
  // 6) Depois de criado, copie o "Application (client) ID" da tela Overview.
  // 7) API permissions → Add a permission → Microsoft Graph → Delegated
  //    permissions → busque e adicione "Calendars.ReadWrite".
  // ======================================================================
  var CONFIG = {
    CLIENT_ID: 'SEU_CLIENT_ID_AQUI.apps.googleusercontent.com',
    SPREADSHEET_ID: 'SEU_SPREADSHEET_ID_AQUI',
    MS_CLIENT_ID: 'SEU_CLIENT_ID_DA_MICROSOFT_AQUI',
  };

  var STORAGE_KEY = 'kanban_workspaces_v1';
  var LEGACY_KEY = 'kanban_board_v1';
  var THEME_KEY = 'kanban_theme';
  var ACTIVE_WS_KEY = 'kanban_active_workspace';
  var STATUSES = ['todo', 'doing', 'done'];
  var WORKSPACES = ['profissional', 'pessoal'];
  var WORKSPACE_LABELS = { profissional: 'Profissional', pessoal: 'Pessoal & Estudos' };
  var PALETTE = ['blue', 'purple', 'teal', 'amber', 'green', 'copper', 'rose', 'slate'];
  var PRIORITY_LABELS = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };

  var DEFAULT_TAGS = {
    profissional: [
      { id: 'operacao', label: 'Operação', color: 'blue' },
      { id: 'projetos', label: 'Projetos', color: 'purple' },
      { id: 'administrativo', label: 'Administrativo', color: 'teal' }
    ],
    pessoal: [
      { id: 'engenharia', label: 'Engenharia', color: 'amber' },
      { id: 'saude', label: 'Saúde/Treino', color: 'green' },
      { id: 'casa', label: 'Casa/Rotina', color: 'copper' }
    ]
  };

  var workspaces = {
    profissional: { todo: [], doing: [], done: [], tags: [] },
    pessoal: { todo: [], doing: [], done: [], tags: [] }
  };
  var activeWorkspace = 'profissional';
  var editingTask = null;
  var defaultAddStatus = 'todo';

  function activeBoard() { return workspaces[activeWorkspace]; }
  function getTag(ws, id) {
    var found = (workspaces[ws].tags || []).find(function (t) { return t.id === id; });
    return found || { id: id, label: id, color: 'slate' };
  }

  // ---------- persistence ----------
  function migrateLegacy() {
    try {
      var raw = localStorage.getItem(LEGACY_KEY);
      if (!raw) return false;
      var old = JSON.parse(raw);
      STATUSES.forEach(function (status) {
        (old[status] || []).forEach(function (t) {
          var ws, tag;
          if (t.category === 'trabalho') { ws = 'profissional'; tag = 'operacao'; }
          else if (t.category === 'estudos') { ws = 'pessoal'; tag = 'engenharia'; }
          else { ws = 'pessoal'; tag = 'casa'; }
          workspaces[ws][status].push({
            id: t.id, title: t.title, description: t.description || '',
            dueDate: t.dueDate || null, priority: t.priority || 'media', tag: tag
          });
        });
      });
      localStorage.removeItem(LEGACY_KEY);
      return true;
    } catch (e) { console.error('migração falhou', e); return false; }
  }

  function ensureTags() {
    WORKSPACES.forEach(function (ws) {
      if (!Array.isArray(workspaces[ws].tags) || !workspaces[ws].tags.length) {
        workspaces[ws].tags = DEFAULT_TAGS[ws].map(function (t) { return Object.assign({}, t); });
      }
    });
  }

  function loadWorkspaces() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        WORKSPACES.forEach(function (ws) {
          if (parsed[ws]) {
            STATUSES.forEach(function (s) { workspaces[ws][s] = Array.isArray(parsed[ws][s]) ? parsed[ws][s] : []; });
            workspaces[ws].tags = Array.isArray(parsed[ws].tags) ? parsed[ws].tags : [];
          }
        });
      } else {
        migrateLegacy();
      }
    } catch (e) { console.error(e); }
    ensureTags();
  }
  function saveWorkspaces() {
    var ws = activeWorkspace;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(workspaces)); } catch (e) { console.error('falha ao salvar localmente', e); }
    if (!signedIn) return;
    var body = { todo: workspaces[ws].todo, doing: workspaces[ws].doing, done: workspaces[ws].done, tags: workspaces[ws].tags };
    var json = JSON.stringify(body);
    var chain = sheetsWriteChain[ws] || Promise.resolve();
    sheetsWriteChain[ws] = chain.then(function () {
      return sheetsSetCell(ws, json);
    }).catch(function (err) {
      showToast('Não foi possível salvar na planilha agora (' + describeApiError(err) + '). Fica guardado neste navegador até a próxima tentativa.', 'error');
    });
  }

  function seedDemoFor(ws, body) {
    if (ws === 'profissional') {
      body.todo.push({ id: 'seed-prof', title: 'Arrastar cartões entre as colunas', description: 'Segure e arraste este cartão para "Em Andamento".', dueDate: null, tag: 'operacao', priority: 'baixa', gcalEventId: null, msEventId: null });
    } else {
      body.todo.push({ id: 'seed-pes', title: 'Revisar óleo do Fox', description: 'Exemplo de tarefa da rotina pessoal.', dueDate: null, tag: 'casa', priority: 'media', gcalEventId: null, msEventId: null });
    }
  }

  function seedIfEmptyLocal() {
    var totalTasks = STATUSES.reduce(function (n, s) { return n + workspaces.profissional[s].length + workspaces.pessoal[s].length; }, 0);
    if (totalTasks === 0) {
      seedDemoFor('profissional', workspaces.profissional);
      seedDemoFor('pessoal', workspaces.pessoal);
    }
  }

  function updateStorageStatusFooter() {
    var el = document.getElementById('storageStatus');
    if (!el) return;
    var parts = [
      signedIn ? 'planilha sincronizada' : 'planilha salva só neste navegador',
      signedIn ? 'Google Calendar conectado (Pessoal & Estudos)' : 'Google Calendar não conectado',
      msSignedIn ? 'Outlook conectado (Profissional)' : 'Outlook não conectado',
    ];
    el.textContent = parts.join(' • ');
  }

  // ---------- Google OAuth (Identity Services) ----------
  var accessToken = null;
  var signedIn = false;
  var tokenClient = null;
  var sheetsWriteChain = { profissional: Promise.resolve(), pessoal: Promise.resolve() };
  var GOOGLE_SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.events';

  function checkConfigAndWarn() {
    var missing = [];
    if (CONFIG.CLIENT_ID.indexOf('SEU_CLIENT_ID_AQUI') === 0) missing.push('CONFIG.CLIENT_ID (Google)');
    if (CONFIG.SPREADSHEET_ID.indexOf('SEU_SPREADSHEET_ID') === 0) missing.push('CONFIG.SPREADSHEET_ID (planilha)');
    if (CONFIG.MS_CLIENT_ID.indexOf('SEU_CLIENT_ID_DA_MICROSOFT') === 0) missing.push('CONFIG.MS_CLIENT_ID (Microsoft)');
    var el = document.getElementById('configWarning');
    if (missing.length) {
      el.textContent = 'Falta preencher no início do script: ' + missing.join(', ') + '. Veja os comentários no código.';
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
    return missing.length === 0;
  }

  function waitForGoogleThenInit(retries) {
    if (window.google && google.accounts && google.accounts.oauth2) {
      initGoogleAuth();
    } else if (retries > 0) {
      setTimeout(function () { waitForGoogleThenInit(retries - 1); }, 200);
    } else {
      showToast('Não consegui carregar o login do Google. Verifique sua internet e recarregue a página.', 'error');
    }
  }

  function initGoogleAuth() {
    if (CONFIG.CLIENT_ID.indexOf('SEU_CLIENT_ID') === 0) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: function (resp) {
        if (resp.error) { showToast('Não foi possível entrar com o Google (' + resp.error + ').', 'error'); return; }
        accessToken = resp.access_token;
        signedIn = true;
        document.getElementById('googleSignInLabel').textContent = 'Conectado ✓';
        updateStorageStatusFooter();
        loadFromSheets();
      },
    });
  }

  function refreshToken() {
    return new Promise(function (resolve) {
      if (!tokenClient) { resolve(); return; }
      var previousCallback = tokenClient.callback;
      tokenClient.callback = function (resp) {
        if (!resp.error) accessToken = resp.access_token;
        tokenClient.callback = previousCallback;
        resolve();
      };
      tokenClient.requestAccessToken({ prompt: '' });
    });
  }

  document.getElementById('googleSignInBtn').addEventListener('click', function () {
    if (CONFIG.CLIENT_ID.indexOf('SEU_CLIENT_ID') === 0) { checkConfigAndWarn(); return; }
    if (signedIn) {
      accessToken = null;
      signedIn = false;
      document.getElementById('googleSignInLabel').textContent = 'Entrar com o Google';
      updateStorageStatusFooter();
      return;
    }
    if (!tokenClient) { showToast('Configuração do Google ainda carregando — tente de novo em instantes.', 'error'); return; }
    tokenClient.requestAccessToken({ prompt: '' });
  });

  async function authorizedFetch(url, options) {
    options = options || {};
    options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + accessToken });
    var res = await fetch(url, options);
    if (res.status === 401) {
      await refreshToken();
      options.headers.Authorization = 'Bearer ' + accessToken;
      res = await fetch(url, options);
    }
    return res;
  }

  async function parseApiError(res) {
    var body = null;
    try { body = await res.json(); } catch (e) {}
    return { code: res.status, message: body && body.error && body.error.message };
  }

  function describeApiError(err) {
    var code = err && err.code;
    switch (code) {
      case 401: return 'sessão do Google expirou, tente entrar de novo';
      case 403: return 'permissão negada — confira os escopos autorizados no Google Cloud';
      case 404: return 'não encontrado';
      case 429: return 'limite de uso do Google atingido, tente daqui a pouco';
      default: return (err && err.message) || ('erro ' + code);
    }
  }

  // ---------- Google Sheets como banco de dados ----------
  var SHEETS_BASE = 'https://sheets.googleapis.com/v4/spreadsheets/';

  async function ensureSheetTab(ws) {
    var res = await authorizedFetch(SHEETS_BASE + CONFIG.SPREADSHEET_ID + '?fields=sheets.properties.title');
    if (!res.ok) throw await parseApiError(res);
    var data = await res.json();
    var titles = (data.sheets || []).map(function (s) { return s.properties.title; });
    if (titles.indexOf(ws) === -1) {
      var addRes = await authorizedFetch(SHEETS_BASE + CONFIG.SPREADSHEET_ID + ':batchUpdate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: [{ addSheet: { properties: { title: ws } } }] }),
      });
      if (!addRes.ok) throw await parseApiError(addRes);
    }
  }

  async function sheetsGetCell(ws) {
    var range = ws + '!A1';
    var res = await authorizedFetch(SHEETS_BASE + CONFIG.SPREADSHEET_ID + '/values/' + encodeURIComponent(range));
    if (res.status === 400) {
      var errBody = await res.json().catch(function () { return null; });
      var msg = (errBody && errBody.error && errBody.error.message) || '';
      if (msg.indexOf('Unable to parse range') !== -1) return null; // aba ainda não existe
      throw { code: 400, message: msg };
    }
    if (!res.ok) throw await parseApiError(res);
    var data = await res.json();
    return (data.values && data.values[0] && data.values[0][0]) || null;
  }

  async function sheetsSetCell(ws, jsonString) {
    await ensureSheetTab(ws);
    var range = ws + '!A1';
    var res = await authorizedFetch(SHEETS_BASE + CONFIG.SPREADSHEET_ID + '/values/' + encodeURIComponent(range) + '?valueInputOption=RAW', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[jsonString]] }),
    });
    if (!res.ok) throw await parseApiError(res);
  }

  async function loadFromSheets() {
    for (var i = 0; i < WORKSPACES.length; i++) {
      var ws = WORKSPACES[i];
      try {
        var raw = await sheetsGetCell(ws);
        if (raw) {
          var parsed = JSON.parse(raw);
          STATUSES.forEach(function (s) { workspaces[ws][s] = Array.isArray(parsed[s]) ? parsed[s] : []; });
          workspaces[ws].tags = (Array.isArray(parsed.tags) && parsed.tags.length) ? parsed.tags : DEFAULT_TAGS[ws].map(function (t) { return Object.assign({}, t); });
        } else {
          if (!workspaces[ws].todo.length && !workspaces[ws].doing.length && !workspaces[ws].done.length) seedDemoFor(ws, workspaces[ws]);
          await sheetsSetCell(ws, JSON.stringify({ todo: workspaces[ws].todo, doing: workspaces[ws].doing, done: workspaces[ws].done, tags: workspaces[ws].tags }));
        }
      } catch (e) {
        showToast('Não deu para carregar "' + WORKSPACE_LABELS[ws] + '" da planilha (' + describeApiError(e) + ').', 'error');
      }
    }
    render();
    updateStorageStatusFooter();
  }

  // ---------- theme ----------
  function applyStoredTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    renderThemeIcon();
  }
  function isDarkEffective() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit === 'dark') return true;
    if (explicit === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function renderThemeIcon() {
    var btn = document.getElementById('themeToggle');
    var dark = isDarkEffective();
    btn.innerHTML = dark
      ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
  }
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = isDarkEffective() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    renderThemeIcon();
  });

  // ---------- helpers ----------
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function formatDate(iso) {
    var p = iso.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] : iso;
  }
  function calendarIcon() {
    return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
  }
  function pencilIcon() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  }
  function trashIcon() {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
  }

  // ---------- render board ----------
  function render() {
    document.documentElement.setAttribute('data-workspace', activeWorkspace);
    document.querySelectorAll('.ws-tab').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-workspace') === activeWorkspace);
    });
    var board = activeBoard();
    STATUSES.forEach(function (status) {
      document.getElementById('count-' + status).textContent = board[status].length;
      var body = document.getElementById('body-' + status);
      if (!board[status].length) {
        var emptyMsg = status === 'todo' ? 'Nada por aqui — adicione sua primeira tarefa.'
          : status === 'doing' ? 'Nenhuma tarefa em andamento.'
          : 'Nada concluído ainda.';
        body.innerHTML = '<p class="text-xs px-2 py-6 text-center" style="color:var(--ink-faint)">' + emptyMsg + '</p>';
      } else {
        body.innerHTML = board[status].map(renderCard).join('');
      }
    });
  }

  function renderCard(task) {
    var priVar = '--pri-' + task.priority + '-line';
    var tagInfo = getTag(activeWorkspace, task.tag);
    var dueHtml = '';
    if (task.dueDate) {
      var overdue = task.dueDate < todayIso();
      var syncedEventId = activeWorkspace === 'profissional' ? task.msEventId : task.gcalEventId;
      var syncedLabel = activeWorkspace === 'profissional' ? 'Sincronizado com o Outlook' : 'Sincronizado com o Google Calendar';
      var syncedTitle = syncedEventId ? ' title="' + syncedLabel + '"' : '';
      dueHtml = '<span class="due' + (overdue ? ' overdue' : '') + '" data-synced="' + (syncedEventId ? 'true' : 'false') + '"' + syncedTitle + '>' + calendarIcon() + formatDate(task.dueDate) + '</span>';
    }
    return (
      '<div class="kanban-card" data-id="' + task.id + '" style="--pri-color:var(' + priVar + ')">' +
        '<div class="flex items-start justify-between gap-2">' +
          '<p class="card-title">' + escapeHtml(task.title) + '</p>' +
          '<div class="card-actions flex gap-0.5 shrink-0">' +
            '<button type="button" data-action="edit" aria-label="Editar">' + pencilIcon() + '</button>' +
            '<button type="button" data-action="delete" aria-label="Excluir">' + trashIcon() + '</button>' +
          '</div>' +
        '</div>' +
        (task.description ? '<p class="card-desc">' + escapeHtml(task.description) + '</p>' : '') +
        '<div class="flex flex-wrap gap-1.5 mt-2">' +
          '<span class="tag" data-color="' + tagInfo.color + '">' + escapeHtml(tagInfo.label) + '</span>' +
          '<span class="priority-badge pri-' + task.priority + '">' + PRIORITY_LABELS[task.priority] + '</span>' +
          dueHtml +
        '</div>' +
      '</div>'
    );
  }

  // ---------- workspace switching ----------
  function saveActiveWorkspace() {
    try { localStorage.setItem(ACTIVE_WS_KEY, activeWorkspace); } catch (e) {}
  }
  function updateMsButtonVisibility() {
    var btn = document.getElementById('msSignInBtn');
    if (activeWorkspace === 'profissional') {
      btn.classList.remove('hidden'); btn.classList.add('flex');
    } else {
      btn.classList.remove('flex'); btn.classList.add('hidden');
    }
  }
  document.getElementById('workspaceTabs').addEventListener('click', function (e) {

  // ---------- Google Calendar sync (quadro Pessoal & Estudos) ----------
  var CAL_BASE = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';

  function showToast(message, kind) {
    var host = document.getElementById('toastHost');
    var el = document.createElement('div');

  }

  function dueDateToTimes(dueDateIso, hour) {
    var parts = dueDateIso.split('-').map(Number);
    var start = new Date(parts[0], parts[1] - 1, parts[2], hour, 0, 0);
    var end = new Date(start.getTime() + 30 * 60000);
    return { startTime: start.toISOString(), endTime: end.toISOString() };
  }

  function buildEventDescription(task) {
    var lines = [];
    if (task.description) lines.push(task.description);
    lines.push('Via Kanban Pessoal — ' + WORKSPACE_LABELS[activeWorkspace] + '.');
    return lines.join('\n\n');
  }

  function toCalendarEventBody(input) {
    return {
      summary: input.summary,
      description: input.description,
      start: { dateTime: input.startTime, timeZone: input.timeZone },
      end: { dateTime: input.endTime, timeZone: input.timeZone },
      reminders: { useDefault: false, overrides: input.overrideReminders },
    };
  }

  async function calendarCreateEvent(input) {
    var res = await authorizedFetch(CAL_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toCalendarEventBody(input)),
    });
    if (!res.ok) throw await parseApiError(res);
    return res.json();
  }
  async function calendarUpdateEvent(eventId, input) {
    var res = await authorizedFetch(CAL_BASE + '/' + eventId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toCalendarEventBody(input)),
    });
    if (!res.ok) throw await parseApiError(res);
    return res.json();
  }
  async function calendarDeleteEvent(eventId) {
    var res = await authorizedFetch(CAL_BASE + '/' + eventId, { method: 'DELETE' });
    if (!res.ok && res.status !== 410 && res.status !== 404) throw await parseApiError(res);
  }

  // ---------- Microsoft / Outlook Calendar sync (quadro Profissional) ----------
  var GRAPH_BASE = 'https://graph.microsoft.com/v1.0/me/events';
  var msalInstance = null;
  var msSignedIn = false;
  var msAccount = null;
  var MS_SCOPES = ['Calendars.ReadWrite'];

  function initMsalThenCheck() {
    if (!window.msal) { showToast('Não consegui carregar o login da Microsoft. Verifique sua internet e recarregue a página.', 'error'); return; }
    if (CONFIG.MS_CLIENT_ID.indexOf('SEU_CLIENT_ID_DA_MICROSOFT') === 0) return; // aviso já mostrado pelo Google se for o caso
    msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: CONFIG.MS_CLIENT_ID,
        authority: 'https://login.microsoftonline.com/common',
        redirectUri: window.location.href.split('#')[0].split('?')[0],
      },
      cache: { cacheLocation: 'localStorage' },
    });
    var accounts = msalInstance.getAllAccounts();
    if (accounts.length) {
      msAccount = accounts[0];
      msSignedIn = true;
      document.getElementById('msSignInLabel').textContent = 'Conectado ✓';
      updateStorageStatusFooter();
    }
  }

  document.getElementById('msSignInBtn').addEventListener('click', function () {
    if (CONFIG.MS_CLIENT_ID.indexOf('SEU_CLIENT_ID_DA_MICROSOFT') === 0) { checkConfigAndWarn(); return; }
    if (!msalInstance) { showToast('Configuração da Microsoft ainda carregando — tente de novo em instantes.', 'error'); return; }
    if (msSignedIn) {
      msAccount = null;
      msSignedIn = false;
      document.getElementById('msSignInLabel').textContent = 'Entrar com a Microsoft';
      updateStorageStatusFooter();
      return;
    }
    msalInstance.loginPopup({ scopes: MS_SCOPES }).then(function (response) {
      msAccount = response.account;
      msSignedIn = true;
      document.getElementById('msSignInLabel').textContent = 'Conectado ✓';
      updateStorageStatusFooter();
    }).catch(function (err) {
      showToast('Não foi possível entrar com a Microsoft (' + (err && err.errorCode || err) + ').', 'error');
    });
  });

  async function getMsAccessToken() {
    var request = { scopes: MS_SCOPES, account: msAccount };
    try {
      var result = await msalInstance.acquireTokenSilent(request);
      return result.accessToken;
    } catch (e) {
      var result2 = await msalInstance.acquireTokenPopup(request);
      return result2.accessToken;
    }
  }

  function toIsoNoOffset(isoWithZ) {
    return isoWithZ.replace(/\.\d{3}Z$/, ''); // "2026-09-17T13:00:00.000Z" -> "2026-09-17T13:00:00"
  }

  function toGraphEventBody(input) {
    return {
      subject: input.summary,
      body: { contentType: 'text', content: input.description },
      start: { dateTime: toIsoNoOffset(input.startTime), timeZone: 'UTC' },
      end: { dateTime: toIsoNoOffset(input.endTime), timeZone: 'UTC' },
      isReminderOn: true,
      reminderMinutesBeforeStart: 0,
    };
  }

  async function outlookFetch(url, options) {
    options = options || {};
    var token = await getMsAccessToken();
    options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + token });
    return fetch(url, options);
  }

  async function outlookCreateEvent(input) {
    var res = await outlookFetch(GRAPH_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toGraphEventBody(input)),
    });
    if (!res.ok) throw await parseApiError(res);
    return res.json();
  }
  async function outlookUpdateEvent(eventId, input) {
    var res = await outlookFetch(GRAPH_BASE + '/' + eventId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toGraphEventBody(input)),
    });
    if (!res.ok) throw await parseApiError(res);
    return res.json();
  }
  async function outlookDeleteEvent(eventId) {
    var res = await outlookFetch(GRAPH_BASE + '/' + eventId, { method: 'DELETE' });
    if (!res.ok && res.status !== 404) throw await parseApiError(res);
  }

  // ---------- roteador: qual provedor usar conforme o quadro ativo ----------
  async function syncTaskToCalendar(task) {
    var useOutlook = activeWorkspace === 'profissional';
    if (useOutlook ? !msSignedIn : !signedIn) return;
    try {
      if (!task.dueDate) {
        if (useOutlook && task.msEventId) {
          await outlookDeleteEvent(task.msEventId);
          task.msEventId = null;
          saveWorkspaces(); render();
        } else if (!useOutlook && task.gcalEventId) {
          await calendarDeleteEvent(task.gcalEventId);
          task.gcalEventId = null;
          saveWorkspaces(); render();
        }
        return;
      }
      var times = dueDateToTimes(task.dueDate, 9);
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      var input = {
        summary: task.title,
        description: buildEventDescription(task),
        startTime: times.startTime,
        endTime: times.endTime,
        timeZone: tz,
        overrideReminders: [{ method: 'popup', minutes: 0 }],
      };
      if (useOutlook) {
        if (task.msEventId) {
          await outlookUpdateEvent(task.msEventId, input);
        } else {
          var evMs = await outlookCreateEvent(input);
          if (evMs && evMs.id) task.msEventId = evMs.id;
        }
      } else {
        if (task.gcalEventId) {
          await calendarUpdateEvent(task.gcalEventId, input);
        } else {
          var evGc = await calendarCreateEvent(input);
          if (evGc && evGc.id) task.gcalEventId = evGc.id;
        }
      }
      saveWorkspaces(); render();
    } catch (err) {
      var providerName = useOutlook ? 'Outlook' : 'Google Calendar';
      showToast('Não foi possível sincronizar com o ' + providerName + ' (' + describeApiError(err) + ').', 'error');
    }
  }

  async function deleteCalendarEventIfAny(task) {
    var useOutlook = activeWorkspace === 'profissional';
    try {
      if (useOutlook && msSignedIn && task.msEventId) {
        await outlookDeleteEvent(task.msEventId);
      } else if (!useOutlook && signedIn && task.gcalEventId) {
        await calendarDeleteEvent(task.gcalEventId);
      }
    } catch (err) {
      var providerName = useOutlook ? 'Outlook' : 'Google Calendar';
      showToast('Não foi possível remover o evento do ' + providerName + ' (' + describeApiError(err) + ').', 'error');
    }
  }

  // ---------- drag and drop (pointer events, mouse + touch) ----------
  var drag = null;
  var pendingTouch = null;
  var HOLD_MS = 160;

  function boardEl() { return document.getElementById('board'); }

  boardEl().addEventListener('pointerdown', function (e) {
    var cardEl = e.target.closest('.kanban-card');
    if (!cardEl || e.target.closest('[data-action]')) return;
    var id = cardEl.getAttribute('data-id');
    var found = findTaskById(id);
    if (!found) return;

    if (e.pointerType === 'touch' || e.pointerType === 'pen') {
      pendingTouch = {
        id: id, fromStatus: found.status, cardEl: cardEl,
        startX: e.clientX, startY: e.clientY, pointerId: e.pointerId,
      };
      pendingTouch.timer = setTimeout(function () {
        if (pendingTouch) armDrag(pendingTouch.id, pendingTouch.fromStatus, pendingTouch.cardEl, e.clientX, e.clientY, pendingTouch.pointerId);
        pendingTouch = null;
      }, HOLD_MS);
      cardEl.addEventListener('pointermove', onPendingMove);
      cardEl.addEventListener('pointerup', onPendingUp);
      cardEl.addEventListener('pointercancel', onPendingUp);
    } else {
      armDrag(id, found.status, cardEl, e.clientX, e.clientY, e.pointerId);
    }
  });

  function onPendingMove(e) {
    if (!pendingTouch) return;
    var dx = e.clientX - pendingTouch.startX, dy = e.clientY - pendingTouch.startY;
    if (Math.sqrt(dx * dx + dy * dy) > 10) cancelPending();
  }
  function onPendingUp() { cancelPending(); }
  function cancelPending() {
    if (!pendingTouch) return;
    clearTimeout(pendingTouch.timer);
    pendingTouch.cardEl.removeEventListener('pointermove', onPendingMove);
    pendingTouch.cardEl.removeEventListener('pointerup', onPendingUp);
    pendingTouch.cardEl.removeEventListener('pointercancel', onPendingUp);
    pendingTouch = null;
  }

  function armDrag(id, fromStatus, cardEl, clientX, clientY, pointerId) {
    var rect = cardEl.getBoundingClientRect();
    var priColor = cardEl.style.getPropertyValue('--pri-color');
    drag = {
      id: id, fromStatus: fromStatus, cardEl: cardEl, pointerId: pointerId,
      offsetX: clientX - rect.left, offsetY: clientY - rect.top,
      width: rect.width, priColor: priColor, currentDrop: null,
    };
    cardEl.removeEventListener('pointermove', onPendingMove);
    cardEl.removeEventListener('pointerup', onPendingUp);
    cardEl.removeEventListener('pointercancel', onPendingUp);
    cardEl.classList.add('is-dragging-source');
    try { cardEl.setPointerCapture(pointerId); } catch (e) {}

    var ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.style.setProperty('--pri-color', priColor);
    ghost.style.width = drag.width + 'px';
    ghost.innerHTML = '<p class="card-title">' + escapeHtml(findTaskById(id).task.title) + '</p>';
    ghost.style.left = (clientX - drag.offsetX) + 'px';
    ghost.style.top = (clientY - drag.offsetY) + 'px';
    document.body.appendChild(ghost);
    drag.ghostEl = ghost;

    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }

    cardEl.addEventListener('pointermove', onDragMove);
    cardEl.addEventListener('pointerup', onDragEnd);
    cardEl.addEventListener('pointercancel', onDragEnd);
  }

  function onDragMove(e) {
    if (!drag) return;
    drag.ghostEl.style.left = (e.clientX - drag.offsetX) + 'px';
    drag.ghostEl.style.top = (e.clientY - drag.offsetY) + 'px';

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var body = el ? el.closest('.column-body') : null;
    document.querySelectorAll('.column-body.drop-target').forEach(function (b) {
      if (b !== body) b.classList.remove('drop-target');
    });
    if (body) {
      body.classList.add('drop-target');
      var status = body.getAttribute('data-status');
      var cards = Array.prototype.slice.call(body.querySelectorAll('.kanban-card')).filter(function (c) {
        return c.getAttribute('data-id') !== drag.id;
      });
      var index = cards.length;
      for (var i = 0; i < cards.length; i++) {
        var r = cards[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { index = i; break; }
      }
      drag.currentDrop = { status: status, index: index };
    } else {
      drag.currentDrop = null;
    }
  }

  function onDragEnd(e) {
    if (!drag) return;
    var cardEl = drag.cardEl;
    cardEl.classList.remove('is-dragging-source');
    cardEl.removeEventListener('pointermove', onDragMove);
    cardEl.removeEventListener('pointerup', onDragEnd);
    cardEl.removeEventListener('pointercancel', onDragEnd);
    try { cardEl.releasePointerCapture(drag.pointerId); } catch (err) {}
    if (drag.ghostEl) drag.ghostEl.remove();
    document.querySelectorAll('.column-body.drop-target').forEach(function (b) { b.classList.remove('drop-target'); });

    if (drag.currentDrop) {
      moveTask(drag.id, drag.fromStatus, drag.currentDrop.status, drag.currentDrop.index);
    }
    drag = null;
  }

  function moveTask(id, fromStatus, toStatus, toIndex) {
    var board = activeBoard();
    var fromIdx = board[fromStatus].findIndex(function (t) { return t.id === id; });
    if (fromIdx === -1) return;
    var task = board[fromStatus][fromIdx];
    if (fromStatus === toStatus) {
      board[fromStatus].splice(fromIdx, 1);
      var adjIndex = toIndex > fromIdx ? toIndex - 1 : toIndex;
      board[toStatus].splice(adjIndex, 0, task);
    } else {
      board[fromStatus].splice(fromIdx, 1);
      board[toStatus].splice(toIndex, 0, task);
    }
    saveWorkspaces();
    render();
  }

  // ---------- init ----------
  applyStoredTheme();
  try {
    var storedWs = localStorage.getItem(ACTIVE_WS_KEY);
    if (storedWs === 'profissional' || storedWs === 'pessoal') activeWorkspace = storedWs;
  } catch (e) {}
  loadWorkspaces();
  seedIfEmptyLocal();
  render();
  updateMsButtonVisibility();
  updateStorageStatusFooter();
  checkConfigAndWarn();
  waitForGoogleThenInit(25);
  initMsalThenCheck();
})();
</script>
</body>
